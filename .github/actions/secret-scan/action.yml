name: secret-scan
description: Run gitleaks against the checked-out tree

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      run: |
        set -euo pipefail
        VER=8.21.2
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version
    - name: Detect
      shell: bash
      run: |
        set -euo pipefail
        CFG=".gitleaks.toml"
        if [ -f "$CFG" ]; then
          gitleaks detect --source . --no-banner --redact --config "$CFG"
        else
          gitleaks detect --source . --no-banner --redact
        fi
